# Hollowmere: The Forgotten Server 1.4.2 (Tibia client 10.98), its MariaDB database, and the MyAAC website.
# Start everything with `docker compose up -d --build`, or double-click start.bat on Windows.
name: hollowmere

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: forgottenserver
      MARIADB_USER: forgottenserver
      MARIADB_PASSWORD: hollowmere # must match mysqlPass in server/config.lua
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      TZ: ${TZ:-UTC}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build: ./server
    image: hollowmere-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_USER: forgottenserver
      MYSQL_PASSWORD: hollowmere
      MYSQL_DATABASE: forgottenserver
      TZ: ${TZ:-UTC}
    ports:
      - "7171:7171" # login
      - "7172:7172" # game
    volumes:
      # The whole server folder: edit config.lua, data/ (monsters, NPCs, spells, map...) and restart.
      - ./server:/srv

  web:
    build: ./web
    image: hollowmere-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_USER: forgottenserver
      MYSQL_PASSWORD: hollowmere
      MYSQL_DATABASE: forgottenserver
      SITE_URL: ${SITE_URL:-http://localhost}
      ADMIN_ACCOUNT: ${ADMIN_ACCOUNT:?Set ADMIN_ACCOUNT in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_CHARACTER: ${ADMIN_CHARACTER:?Set ADMIN_CHARACTER in .env}
      TZ: ${TZ:-UTC}
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      # MyAAC reads the server's config.lua and data/ (vocations, monsters, items) from here.
      - ./server:/srv/server:ro
      - web-data:/var/www/html

volumes:
  db-data:
  web-data:
